name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24 并启用 npm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 运行单元测试
        run: npm test

  e2e-tests:
    name: 端到端测试
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24 并启用 npm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 安装 Chromium 浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行端到端测试
        run: npm run test:e2e
